name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # lib/firebase_options.dart is gitignored (generated by `flutterfire
      # configure`). CI only needs it to resolve imports for analysis, so a
      # stub with dummy values is enough. Same for the gitignored .env file
      # which pubspec.yaml references as an asset.
      - name: Create CI stubs for gitignored files
        run: |
          touch .env
          if [ ! -f lib/firebase_options.dart ]; then
            cat > lib/firebase_options.dart <<'EOF'
            // Stub for CI only. The real file is gitignored — run
            // `flutterfire configure` to generate it locally.
            import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
            import 'package:flutter/foundation.dart'
                show defaultTargetPlatform, kIsWeb, TargetPlatform;

            class DefaultFirebaseOptions {
              static FirebaseOptions get currentPlatform {
                if (kIsWeb) return web;
                switch (defaultTargetPlatform) {
                  case TargetPlatform.android:
                    return android;
                  case TargetPlatform.iOS:
                    return ios;
                  case TargetPlatform.macOS:
                    return macos;
                  case TargetPlatform.windows:
                    return windows;
                  case TargetPlatform.linux:
                    return linux;
                }
              }

              static const FirebaseOptions android = FirebaseOptions(
                apiKey: 'ci-stub',
                appId: 'ci-stub',
                messagingSenderId: 'ci-stub',
                projectId: 'ci-stub',
              );
              static const FirebaseOptions ios = android;
              static const FirebaseOptions web = android;
              static const FirebaseOptions macos = android;
              static const FirebaseOptions windows = android;
              static const FirebaseOptions linux = android;
            }
            EOF
          fi

      - name: Install dependencies
        run: flutter pub get

      # Fail on errors only — infos/warnings are style lints tracked separately.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test
